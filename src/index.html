<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>

        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

        <link href="./output.css" rel="stylesheet">

        <style>
    body {
      background-image: radial-gradient(circle, #ffe2f1, #ffdaef, #ffd2ee, #ffdaef, #ffd2ee, #ffdaef, #ffe2f1, #ffeaf4, #ffeced, #fff0e4, #fff6de, #fefedf);
      background-repeat: no-repeat;
      background-position: 100% 100%;
      transition: all 0.3s ease;
    }

    .dark-mode {
      background-image: linear-gradient(to right bottom, #091413, #10201e, #142d28, #193a32, #1e473c, #235143, #285b4b, #2e6652, #326f5a, #377861, #3b8169, #408a71)!important;
      color: white;
    }

    #quote {
      cursor: pointer;
    }

    .filter:hover {
        color: #98bdb3;
    }

    li{
        border-radius: 50px;
        padding-inline: 20px;
    }

  </style>
    </head>

    <body id="body" class="w-full h-screen overflow-hidden">

        <div class="fixed top-5 right-5 z-50">
            <button id="darkmood" class="text-2xl hidden">
                <i class="ri-moon-fill"></i>
            </button>

            <button id="lightmood" class="text-2xl">
                <i class="ri-sun-line"></i>
            </button>
        </div>

        <div
            class="max-w-xl bg-transparent mx-auto mt-10 p-5 rounded-2xl shadow-2xl">

            <h1 class="text-2xl font-bold text-center mb-4">Task Manager</h1>

            <p id="quote" class="text-center italic mb-4">
                Click for motivation...
            </p>

            <div class="flex gap-2">
                <input id="taskInput" type="text" placeholder="Enter task..."
                    class="flex-1 border rounded-4xl p-2">
                <button id="addTask"
                    class="bg-green-500 text-white px-4 py-2 rounded">Add</button>
            </div>

            <div class="flex justify-between mt-4">
                <button class="filter" data-filter="all">All</button>
                <button class="filter"
                    data-filter="completed">Completed</button>
                <button class="filter" data-filter="pending">Pending</button>
            </div>

            <ul id="taskList" class="mt-4"></ul>

            <p id="emptyMessage" class="text-center mt-4 hidden">No tasks yet</p>

            <div class="mt-3 text-sm">
                <p>Total: <span id="totalTasks">0</span></p>
                <p>Completed: <span id="completedTasks">0</span></p>
            </div>

        </div>

        <script>

              document.addEventListener("DOMContentLoaded", () => {

  const taskInput = document.getElementById("taskInput");
  const addTaskBtn = document.getElementById("addTask");
  const taskList = document.getElementById("taskList");
  const emptyMessage = document.getElementById("emptyMessage");

  const totalTasks = document.getElementById("totalTasks");
  const completedTasks = document.getElementById("completedTasks");

  const filters = document.querySelectorAll(".filter");
  const quoteEl = document.getElementById("quote");

  const body = document.getElementById("body");


  const darkBtn = document.getElementById("darkmood");
  const lightBtn = document.getElementById("lightmood");

  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
  let currentFilter = "all";


  addTaskBtn.addEventListener("click", () => {
    const text = taskInput.value.trim();
    if (!text) return;

    const task = {
      id: Date.now(),
      text,
      completed: false,
      time: new Date().toLocaleString()
    };

    tasks.push(task);
    saveTasks();
    renderTasks();
    taskInput.value = "";
  });


  taskInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") addTaskBtn.click();
  });


  function renderTasks() {
    taskList.innerHTML = "";

    let filteredTasks = tasks.filter(task => {
      if (currentFilter === "completed") return task.completed;
      if (currentFilter === "pending") return !task.completed;
      return true;
    });

    emptyMessage.classList.toggle("hidden", filteredTasks.length !== 0);

    filteredTasks.forEach(task => {
      const li = document.createElement("li");
      li.className = "flex justify-between items-center border p-2 mt-2";

      const textDiv = document.createElement("div");

      const taskText = document.createElement("p");
      taskText.textContent = task.text;
      if (task.completed) taskText.classList.add("line-through");

      const time = document.createElement("small");
      time.textContent = task.time;

      textDiv.appendChild(taskText);
      textDiv.appendChild(time);


      const btnDiv = document.createElement("div");
      btnDiv.className = "flex gap-2";

      const completeBtn = document.createElement("button");
      completeBtn.textContent = "✔";
      completeBtn.addEventListener("click", () => toggleComplete(task.id));

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "❌";
      deleteBtn.addEventListener("click", () => deleteTask(task.id));

      btnDiv.appendChild(completeBtn);
      btnDiv.appendChild(deleteBtn);

      li.appendChild(textDiv);
      li.appendChild(btnDiv);

      taskList.appendChild(li);
    });

    updateStats();
  }
  

  function updateStats() {
      const total = tasks.length;

      const completed = tasks.filter(task => task.completed).length;

  
      totalTasks.textContent = total;
      completedTasks.textContent = completed;
    }
    

  function toggleComplete(id) {
    tasks = tasks.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    saveTasks();
    renderTasks();
  }


  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    saveTasks();
    renderTasks();
  }


  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }


  filters.forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });


  async function fetchQuote() {
    try {
      quoteEl.textContent = "Loading...";
      const res = await fetch("https://api.adviceslip.com/advice?t=" + Date.now());
      const data = await res.json();
      quoteEl.textContent = `"${data.slip.advice}"`;
    } catch (error) {
      quoteEl.textContent = "⚠️ Failed to load quote.";
      console.error(error);
    }
  }


  quoteEl.addEventListener("click", fetchQuote);


  setInterval(fetchQuote, 20000);


  darkBtn.addEventListener("click", () => {
    body.classList.add("dark-mode");
    localStorage.setItem("theme", "dark");

    darkBtn.classList.add("hidden");
    lightBtn.classList.remove("hidden");
  });


  lightBtn.addEventListener("click", () => {
    body.classList.remove("dark-mode");
    localStorage.setItem("theme", "light");

    lightBtn.classList.add("hidden");
    darkBtn.classList.remove("hidden");
  });


  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark") {
    body.classList.add("dark-mode");
    darkBtn.classList.add("hidden");
    lightBtn.classList.remove("hidden");
  } else {
    body.classList.remove("dark-mode");
    lightBtn.classList.add("hidden");
    darkBtn.classList.remove("hidden");
  }

  fetchQuote();
  renderTasks();

});
        </script>

    </body>
</html>
